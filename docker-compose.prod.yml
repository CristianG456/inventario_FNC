# ==============================================================================
# docker-compose.prod.yml — PRODUCCIÓN
# ==============================================================================
# Uso: docker compose -f docker-compose.prod.yml up -d
# ==============================================================================
# Requiere únicamente:
#   - Este archivo
#   - Variables de entorno configuradas en el host o en .env del host
# No requiere copiar código fuente. Todo viene dentro de las imágenes.
# ==============================================================================

version: "3.8"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  app:
    image: ${DOCKER_IMAGE:-cristian123456/inventario_equipos:v1.0.0}
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      # --- APLICACIÓN ---
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

      # --- BASE DE DATOS ---
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

      # --- ADMINISTRADOR INICIAL ---
      SYSTEM_ADMIN_NAME: ${SYSTEM_ADMIN_NAME}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD}
      SYSTEM_FORCE_PASSWORD_CHANGE: ${SYSTEM_FORCE_PASSWORD_CHANGE:-true}

      # --- SESIONES ---
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}

      # --- CACHE / COLAS ---
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}

      # --- LOG ---
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # --- MIGRACIONES ---
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

      # --- CORREO ---
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}

      # --- REDIS ---
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/storage
      - actas_firmadas_data:/var/www/storage/app/actas_firmadas
    networks:
      - laravel
    logging: *default-logging

  webserver:
    image: ${DOCKER_NGINX_IMAGE:-cristian123456/inventario-nginx:v1.0.0}
    container_name: nginx_server
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-3300}:80"
    volumes:
      - laravel_storage:/var/www/storage
    networks:
      - laravel
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

