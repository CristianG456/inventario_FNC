version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    container_name: laravel_app
    working_dir: /var/www
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - bootstrap_cache_data:/var/www/bootstrap/cache
      - framework_cache_data:/var/www/storage/framework/cache/data
      - framework_views_data:/var/www/storage/framework/views
      - actas_firmadas_data:/var/www/storage/app/actas_firmadas
    networks:
      - laravel
    logging: *default-logging

  webserver:
    image: nginx:alpine
    container_name: nginx_server
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
    restart: unless-stopped
    ports:
      - "3300:80"
    volumes:
      - .:/var/www
      - actas_firmadas_data:/var/www/storage/app/actas_firmadas
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - laravel
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: mysql_db
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Bogota}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql_mode=""
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

